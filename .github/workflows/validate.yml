name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      # hacs/action reads hacs.json and manifest.json from raw.githubusercontent.com
      # without a token, so both checks get a 404 while the repository is private.
      - name: Skip checks that cannot read a private repository
        id: private
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)" = "true" ]; then
            echo "ignore=hacsjson integration_manifest" >> "$GITHUB_OUTPUT"
          fi
      - uses: hacs/action@main
        with:
          category: integration
          ignore: ${{ steps.private.outputs.ignore }}
